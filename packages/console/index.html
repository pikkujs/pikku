<!doctype html>
<html lang="en" data-mantine-color-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything but 0, so the shell can pad by the display cutout and the home
         indicator itself. Without it the phone's tab bar sits under the gesture
         bar on every notched device. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="%VITE_CONSOLE_DESCRIPTION%" />
    <title>%VITE_CONSOLE_TITLE%</title>
    <style>
      html {
        font-size: 18px;
      }
    </style>
    <script>
      try {
        var scheme = localStorage.getItem('mantine-color-scheme')
        if (scheme) {
          document.documentElement.setAttribute(
            'data-mantine-color-scheme',
            scheme
          )
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
