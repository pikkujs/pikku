<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Notes</title>
  </head>
  <body>
    <h1 data-testid="heading">Notes</h1>
    <p data-testid="state">…</p>
    <div data-testid="gate" hidden>
      <label for="passphrase" data-testid="gate-label"></label>
      <input id="passphrase" data-testid="passphrase" type="password" />
      <button data-testid="submit"></button>
      <p data-testid="gate-error"></p>
    </div>
    <div data-testid="notes-panel" hidden>
      <ul data-testid="notes"></ul>
      <input data-testid="new-note" type="text" />
      <button data-testid="add">Add</button>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
