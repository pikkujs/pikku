name: CI

# Pull requests only, and not drafts: a branch uses no runners until it is up
# for review. `ready_for_review` starts the run a draft skipped.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# better-auth now throws on a missing BETTER_AUTH_SECRET (mapSession errors no
# longer swallowed), so every job that builds/prerenders/runs a template needs
# it present. Inherited by all jobs (build, templates, verifiers, e2e) and by
# spawned bundles via process.env. Build-only dummy, ≥32 chars — never a real secret.
env:
  BETTER_AUTH_SECRET: ci-build-only-better-auth-secret-not-real

jobs:
  validate-deps:
    name: Validate Package Deps
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check published deps for workspace protocol
        run: node scripts/check-no-workspace-protocol.mjs
      - name: Check no publish-time CLI rebuild
        run: node scripts/check-no-publish-time-cli-rebuild.mjs
      - name: Check every publishable package declares its repository
        run: node scripts/check-repository-field.mjs
      - name: Test the semver range helpers
        run: node --test scripts/semver-ranges.test.mjs
      - name: Test the merged-worktree reporter
        run: node --test scripts/merged-worktrees.test.mjs
      - name: Test the live-AI e2e gate
        run: node --test scripts/ai-e2e-gate.test.mjs
      - name: Test the native apps gate
        run: node --test scripts/native-gate.test.mjs
      - name: Check peer dependency ranges agree across the monorepo
        run: node scripts/check-peer-dependency-consistency.mjs
      - name: Check every verifier runs in the full suite
        run: node scripts/check-verifier-matrix.mjs

  lint:
    name: Lint & Format
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          download-build: 'false'
      - name: Check formatting
        run: bun run prettier
      - name: Lint
        run: bun run lint
      - name: Check no runtime i18n key resolvers
        run: node scripts/check-no-i18n-key-resolver.mjs
      # Imports that are not declared resolve through Yarn hoisting in this
      # repo and fail for anyone installing the package on its own, so they
      # stay invisible until a release. See knip.jsonc for what is checked.
      - name: Check for undeclared dependencies
        run: bun run knip

  build:
    name: Build
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check every changeset is a patch
        run: node scripts/check-changesets-are-patch.mjs
      - uses: ./.github/actions/setup
        with:
          download-build: 'false'
      - uses: ./.github/actions/build
        with:
          templates: 'false'

  # Two runners. The sequential one holds what cannot share a machine: the CLI
  # suite spawns subprocesses with 120s timeouts and writes fixtures inside
  # packages/cli that the core suite walks, and the database suites. The rest
  # run package-parallel on the other.
  unit-tests:
    name: Unit Tests (sequential)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    services:
      mysql:
        image: mirror.gcr.io/library/mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: pikku_db_schema
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # @pikku/queue-nats' integration suite skips itself when NATS_TEST_URL is
      # unset, so until this existed it reported pass without ever connecting.
      # Not a `services:` container: `-js` is a command argument and `services:`
      # has no `command:` key, so there is no way to enable JetStream there.
      - name: Start JetStream NATS
        run: |
          docker run -d --rm --name pikku-nats \
            -p 4222:4222 -p 8222:8222 nats:2.14-alpine -js -m 8222
          # /healthz reports JetStream health, not just a bound port, so this
          # waits for a server the tests can actually use.
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz >/dev/null; then
              echo "NATS ready"; exit 0
            fi
            sleep 1
          done
          echo "NATS did not become ready" >&2
          docker logs pikku-nats >&2 || true
          exit 1
      - run: bun run --filter @pikku/cli --filter @pikku/kysely-postgres --filter @pikku/kysely --filter @pikku/mongodb --filter @pikku/queue-nats --filter @pikku/deploy-standalone --sequential test
        env:
          NATS_TEST_URL: nats://127.0.0.1:4222
          PIKKU_TEST_MYSQL_URL: mysql://root:password@127.0.0.1:3306/mysql

  unit-tests-parallel:
    name: Unit Tests (parallel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run --filter '*' --filter '!@pikku/templates-*' --filter '!@pikku/example-*' --filter '!@pikku/verifiers-*' --filter '!@pikku/addon-console' --filter '!@pikku/console' --filter '!@pikku/e2e' --filter '!@pikku/cli' --filter '!@pikku/kysely-postgres' --filter '!@pikku/kysely' --filter '!@pikku/mongodb' --filter '!@pikku/queue-nats' --filter '!@pikku/deploy-standalone' --parallel test

  e2e:
    name: E2E Standard
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pikkujs/pikku-e2e:v1.58.2-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/e2e-codegen
      - name: Run e2e tests
        run: bun run test:e2e
      - name: Run deterministic agent e2e tests
        if: ${{ !cancelled() }}
        run: bun run test:e2e:agent

  # Newly guarded: `tests/cli/` drives the CLI as a subprocess against a server
  # it spawns itself, so it is a node:test suite rather than a scenario and ran
  # in no job until now.
  e2e-cli:
    name: E2E CLI
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pikkujs/pikku-e2e:v1.58.2-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/e2e-codegen
      - name: Run CLI e2e tests
        run: bun run test:e2e:cli

  # Newly guarded: the console browser scenarios ran in no CI job while they were
  # cucumber, so their first exposure here is expected to surface real flake.
  # `continue-on-error` keeps that from blocking; remove it once it settles.
  e2e-console:
    name: E2E Console
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pikkujs/pikku-e2e:v1.58.2-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/e2e-codegen
      - name: Run console browser scenarios
        run: bun run test:e2e:console

  # Live-model scenarios are the only coverage the agent runner has, but they
  # spend real tokens and about twenty minutes, so they run only on the pull
  # requests that can break them: `scripts/ai-e2e-gate.mjs` says which those
  # are. Off unless the repo variable AI_LIVE_E2E is 'true'.
  ai-gate:
    name: AI e2e gate
    if: ${{ vars.AI_LIVE_E2E == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        run: node scripts/ai-e2e-gate.mjs >> "$GITHUB_OUTPUT"
        env:
          # No BEFORE_SHA: the gate diffs from the merge base with origin/main,
          # which is the whole pull request.
          AFTER_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_MESSAGE: ${{ github.event.pull_request.title }}

  e2e-ai-live:
    name: E2E AI (live)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pikkujs/pikku-e2e:v1.58.2-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    needs: [build, ai-gate]
    # A fork has no OPENROUTER_API_KEY, so every scenario there would fail with
    # AIProviderNotConfiguredError before it said anything.
    if: ${{ needs.ai-gate.outputs.run == 'true' && github.repository_owner == 'pikkujs' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/e2e-codegen
      - name: Run live-model AI e2e tests
        timeout-minutes: 22
        run: bun run test:e2e:ai-live
        env:
          # OpenRouter, reached through the standard OPENAI_* pair because
          # `createDevAgentRunner` builds one openai-compatible provider from
          # whatever that pair points at. `parseModel` strips the provider
          # prefix, so the agents' `openai/gpt-5.6-luna` arrives as
          # `gpt-5.6-luna` — which OpenRouter resolves to the same model an
          # unprefixed name would. No agent declaration changes.
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # A persona's own turns are LLM calls made in the scenario process,
          # not on the target, and that runner is built by `createDevAgentRunner`
          # — which needs a base URL paired with the key and disables agents
          # without one.
          OPENAI_BASE_URL: https://openrouter.ai/api/v1

  # The native apps: e2e/packages/web built once into a dist, then packaged by
  # Tauri on each platform from that one artifact — the flow a project follows
  # to ship its frontend as an app. Each smoke test launches the package against
  # a live e2e server and waits for the app to record `native_opened` there
  # (scripts/native-smoke.mjs). Gated like the live AI scenarios, since Rust,
  # Gradle, an emulator and a simulator are half an hour of runners.
  native-gate:
    name: Native apps gate
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        run: node scripts/native-gate.mjs >> "$GITHUB_OUTPUT"
        env:
          AFTER_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_MESSAGE: ${{ github.event.pull_request.title }}

  native-web:
    name: Native web dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, native-gate]
    if: ${{ needs.native-gate.outputs.run == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/e2e-codegen
      # `.env.native` points the build at http://localhost:4077, where each
      # smoke job runs the e2e server.
      - name: Build the web app for the native shell
        working-directory: e2e/packages/web
        run: bun run build:native
      # Nothing native is committed: the Tauri project is written here from the
      # `native` entry in e2e/pikku.config.json, then given the full icon set,
      # exactly as `pikku app native init`'s next steps tell a user to.
      - name: Create the native project
        working-directory: e2e
        run: npx pikku app native init web
      - name: Generate the icon set
        working-directory: e2e/packages/web
        run: npx --yes @tauri-apps/cli@2 icon src-tauri/icons/icon.png
      - uses: actions/upload-artifact@v7
        with:
          name: native-web-dist
          path: |
            e2e/packages/web/dist-native
            e2e/packages/web/src-tauri
          if-no-files-found: error
          retention-days: 7

  native-desktop:
    name: Native desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: [build, native-gate, native-web]
    if: ${{ needs.native-gate.outputs.run == 'true' }}
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            bundles: deb,appimage
            smoke: true
          - name: macos
            os: macos-latest
            bundles: app,dmg
            smoke: true
          # Runs but may fail: it has not yet passed end to end — see
          # knowledge/projects/pikku/status/native-apps-1908.md.
          - name: windows
            os: windows-latest
            bundles: nsis,msi
            smoke: true
            optional: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: native-web-dist
          path: e2e/packages/web
      - name: Install the WebKitGTK toolchain
        if: ${{ matrix.name == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: e2e/packages/web/src-tauri -> target
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Package the app
        working-directory: e2e/packages/web
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.name }}
          path: e2e/packages/web/src-tauri/target/release/bundle
          if-no-files-found: error
          retention-days: 7
      - if: ${{ matrix.smoke }}
        uses: ./.github/actions/setup
      - if: ${{ matrix.smoke }}
        uses: ./.github/actions/e2e-backend
      - name: Launch the app and wait for it to call home
        if: ${{ matrix.smoke }}
        working-directory: e2e/packages/web
        shell: bash
        run: |
          case "${{ matrix.name }}" in
            linux) xvfb-run -a src-tauri/target/release/web-app > "$RUNNER_TEMP/app.log" 2>&1 & ;;
            windows) src-tauri/target/release/web-app.exe > "$RUNNER_TEMP/app.log" 2>&1 & ;;
            *) src-tauri/target/release/web-app > "$RUNNER_TEMP/app.log" 2>&1 & ;;
          esac
          node ../../../scripts/native-smoke.mjs http://localhost:4077 120 || { cat "$RUNNER_TEMP/app.log"; exit 1; }

  native-android:
    name: Native Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build, native-gate, native-web]
    if: ${{ needs.native-gate.outputs.run == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: native-web-dist
          path: e2e/packages/web
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: e2e/packages/web/src-tauri -> target
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # gen/android is generated here rather than committed: the e2e app has no
      # manifest, signing or icon changes of its own, and a fresh `init` on every
      # run is what proves the generated project still initialises. A debug
      # build is signed with the debug key, so the APK installs on any phone
      # that allows sideloading, and permits the cleartext localhost API.
      - name: Build a debug APK (arm64 phones + x86_64 emulator)
        working-directory: e2e/packages/web
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx --yes @tauri-apps/cli@2 android init --ci
          npx --yes @tauri-apps/cli@2 android build --apk --debug --target aarch64 --target x86_64
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK=$PWD/$apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: native-android
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/e2e-backend
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # `adb reverse` makes the emulator's localhost:4077 the runner's, so the
      # APK built for localhost reaches the e2e server unchanged.
      - name: Install, launch and wait for it to call home
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb reverse tcp:4077 tcp:4077
            adb install -r "$APK"
            adb shell monkey -p dev.pikku.e2e -c android.intent.category.LAUNCHER 1
            node scripts/native-smoke.mjs http://localhost:4077 180 || (adb logcat -d | tail -200; exit 1)

  # Unsigned, for the simulator only: a build that installs on a phone needs an
  # Apple Developer team, which this repository does not have. What it proves is
  # that the generated project initialises, compiles and runs on iOS.
  native-ios:
    name: Native iOS (simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    needs: [build, native-gate, native-web]
    if: ${{ needs.native-gate.outputs.run == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: native-web-dist
          path: e2e/packages/web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: e2e/packages/web/src-tauri -> target
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build for the simulator
        working-directory: e2e/packages/web
        run: |
          npx --yes @tauri-apps/cli@2 ios init --ci
          npx --yes @tauri-apps/cli@2 ios build --debug --target aarch64-sim --no-sign
          app=$(find src-tauri/gen/apple -name '*.app' -type d -path '*iphonesimulator*' | head -1)
          [ -n "$app" ] || app=$(find src-tauri/gen/apple -name '*.app' -type d | head -1)
          echo "IOS_APP=$PWD/$app" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: native-ios-simulator
          path: ${{ env.IOS_APP }}
          if-no-files-found: error
          retention-days: 7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/e2e-backend
      # The simulator shares the Mac's network, so localhost:4077 is the server.
      - name: Install, launch and wait for it to call home
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$IOS_APP"
          xcrun simctl launch "$udid" dev.pikku.e2e
          node scripts/native-smoke.mjs http://localhost:4077 180
