name: E2E Codegen
description: Generate pikku files for all e2e packages (two-pass for cross-package resolution)

runs:
  using: composite
  steps:
    - name: Generate pikku files for e2e addons
      shell: bash
      run: |
        cd packages/addon/pikku-console && npx pikku all
        cd ../../..
        cd packages/addon/pikku-graph && npx pikku all
        cd ../../..
        cd e2e/packages/todos && npx pikku all
        cd ../../..
        cd e2e/packages/emails && npx pikku all
    - name: Generate pikku files for e2e hmac-signer
      shell: bash
      run: cd e2e/packages/hmac-signer && npx pikku all
    - name: Generate pikku files for e2e oauth-api
      shell: bash
      run: cd e2e/packages/oauth-api && npx pikku all
    - name: Generate pikku files for e2e fake-crm
      shell: bash
      run: cd e2e/packages/fake-crm && npx pikku all
    - name: Generate pikku files for e2e project
      shell: bash
      run: cd e2e && npx pikku all
    - name: Regenerate pikku files (second pass resolves cross-package type imports)
      shell: bash
      run: |
        cd packages/addon/pikku-console && npx pikku all
        cd ../../..
        cd packages/addon/pikku-graph && npx pikku all
        cd ../../..
        cd e2e/packages/todos && npx pikku all
        cd ../../..
        cd e2e/packages/emails && npx pikku all
        cd ../../..
        cd e2e/packages/hmac-signer && npx pikku all
        cd ../../..
        cd e2e/packages/oauth-api && npx pikku all
        cd ../../..
        cd e2e/packages/fake-crm && npx pikku all
        cd ../../..
        cd e2e && npx pikku all
    - name: Compile the regenerated packages
      # Every package above is consumed through its `exports` as dist/, not as
      # source, so the server loads whatever the build job compiled — the
      # regeneration above never reaches it. Without this step a schema that
      # codegen emits here is still missing from the running registry.
      shell: bash
      run: |
        bun run --filter @pikku/addon-console build
        bun run --filter @pikku/addon-graph build
        bun run --filter @pikku/addon-todos build
        bun run --filter @pikku/addon-emails build
        bun run --filter @pikku/addon-hmac-signer build
        bun run --filter @pikku/addon-oauth-api build
        bun run --filter @pikku/addon-fake-crm build
