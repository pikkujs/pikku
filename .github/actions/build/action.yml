name: Build
description: Build all packages, generate pikku files, build templates + console, and upload build artifact

inputs:
  templates:
    description: Build the templates. Only the template jobs in the Full Suite read them.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Restore TypeScript build cache
      id: ts-cache
      uses: actions/cache/restore@v6
      with:
        # tsc -b is incremental: given the prior tsconfig.tsbuildinfo + emitted
        # dist it only recompiles projects whose inputs changed. Key on all
        # package sources + tsconfigs + the lockfile so any change busts it, with
        # a prefix restore-key so unrelated changes still reuse the newest cache.
        #
        # node_modules is excluded because `packages/**/dist` otherwise also
        # matches a dependency's own dist — e.g. packages/console/node_modules/
        # tinyglobby/dist. Restore happens after `bun install`, so once a run
        # where Yarn nested that dependency is cached, every later run whose
        # hoisting differs gets the directory re-created without its
        # package.json, and Node resolves the shadowed folder instead of the
        # hoisted package. The prefix is versioned so entries poisoned that way
        # are never reached through restore-keys.
        #
        # v3 because the compiler changed: a dist and tsbuildinfo emitted by
        # TypeScript 6 are not a base TypeScript 7 can build on, and the source
        # hash does not see the difference. Bump the prefix whenever the
        # compiler that writes this cache changes.
        path: |
          packages/**/tsconfig.tsbuildinfo
          packages/**/dist
          !packages/**/node_modules/**
        key: ts-build-v3-${{ hashFiles('packages/**/src/**/*.ts', 'packages/**/tsconfig*.json', 'bun.lock') }}
        restore-keys: |
          ts-build-v3-
    - name: Build packages
      shell: bash
      run: |
        start=$SECONDS
        bun run build:packages
        echo "::notice::⏱ Build packages: $((SECONDS - start))s"
    # bun only links a workspace package's bin when the file it points at exists
    # at install time, and never backfills it. The Build job installs before
    # anything is built, so `pikku` is missing from node_modules/.bin until the
    # CLI's dist does exist. A repeat install is a no-op apart from the symlinks.
    # Every other job installs after downloading the build artifact, so its dist
    # is already in place by then — but only for a package that job's own
    # workspace declares, which is why the root declares @pikku/cli too.
    - name: Link workspace bins built by the previous step
      shell: bash
      run: bun install
    - name: Build addons
      shell: bash
      run: |
        start=$SECONDS
        bun run build:addons
        echo "::notice::⏱ Build addons: $((SECONDS - start))s"
    - name: Build function-addon template
      if: ${{ inputs.templates == 'true' }}
      shell: bash
      run: |
        start=$SECONDS
        cd templates/function-addon && bun run pikku && bun run build
        echo "::notice::⏱ Build function-addon template: $((SECONDS - start))s"
    - name: Generate pikku files
      shell: bash
      run: |
        start=$SECONDS
        bun run pikku
        echo "::notice::⏱ Generate pikku files: $((SECONDS - start))s"
    - name: Build templates
      if: ${{ inputs.templates == 'true' }}
      shell: bash
      run: |
        start=$SECONDS
        bun run build:templates
        echo "::notice::⏱ Build templates: $((SECONDS - start))s"
    - name: Generate and type-check console
      shell: bash
      run: |
        start=$SECONDS
        cd packages/console && bun run generate && bun run tsc --noEmit
        echo "::notice::⏱ Console type-check: $((SECONDS - start))s"
    - name: Build console
      shell: bash
      run: |
        start=$SECONDS
        bun run build:console
        echo "::notice::⏱ Build console: $((SECONDS - start))s"

    # One tar rather than the tree: upload-artifact sends each file on its own,
    # and ~16 MB of small build files took two minutes that way.
    #
    # The node_modules prune keeps every dependency's own dist and .pikku out.
    #
    # `templates/functions/pikku` is the scaffold directory that config's
    # `scaffold.pikkuDir` names, and it is build output exactly as `.pikku`
    # is. It has to travel with it: a variable or a secret declared in a
    # scaffold is imported by name from `.pikku`, so shipping one without the
    # other hands the next job a generated file whose import resolves to
    # nothing, and codegen there dies on the first re-inspect.
    - name: Pack build output
      shell: bash
      run: |
        {
          find packages templates -name node_modules -prune -o -type d \( -name dist -o -name .pikku \) -print -prune \
            -o -path 'packages/*' -type d -name bin -print -prune
          for dir in packages/cli/console-app templates/functions/pikku; do
            [ -d "$dir" ] && echo "$dir"
          done
        } > "$RUNNER_TEMP/build-output.list"
        tar cf build-output.tar -T "$RUNNER_TEMP/build-output.list"
        ls -lh build-output.tar
    - name: Save build output (for later jobs)
      uses: actions/upload-artifact@v7
      with:
        name: build-output
        path: build-output.tar
        retention-days: 1
    # Branches restore main's cache through the restore key and never save
    # their own: the save took ~40s at the end of every branch build.
    - name: Save TypeScript build cache
      if: ${{ github.ref == 'refs/heads/main' && steps.ts-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: |
          packages/**/tsconfig.tsbuildinfo
          packages/**/dist
          !packages/**/node_modules/**
        key: ${{ steps.ts-cache.outputs.cache-primary-key }}
