name: Branch limit

# At most MAX_BRANCHES branches (main included) may exist on origin.
# Runs when a branch is created and fails loudly if the limit is exceeded.
# Deliberately not a required check: it must never block the merges that
# bring the count back down.

on:
  create:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAX_BRANCHES: 5

jobs:
  count:
    if: github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Count branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branches=$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name')
          count=$(printf '%s\n' "$branches" | grep -c .)
          echo "Branches on origin: $count (max $MAX_BRANCHES)"
          printf '%s\n' "$branches" | sed 's/^/  - /'
          if [ "$count" -gt "$MAX_BRANCHES" ]; then
            echo "::error::$count branches exist, the limit is $MAX_BRANCHES. Merge or delete a branch before creating another."
            exit 1
          fi
