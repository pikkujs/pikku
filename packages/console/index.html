<!doctype html>
<html lang="en" data-mantine-color-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything but 0, so the shell can pad by the display cutout and the home
         indicator itself. Without it the phone's tab bar sits under the gesture
         bar on every notched device. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="%VITE_CONSOLE_DESCRIPTION%" />
    <!-- Relative, because the console is served under a base path (/console/)
         and every URL inside a manifest resolves against the manifest's own
         location. Without this link there is no installable app at all: the
         browser never fires `beforeinstallprompt`, so the install action in the
         account menu can never appear. -->
    <link rel="manifest" href="site.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>%VITE_CONSOLE_TITLE%</title>
    <style>
      html {
        font-size: 18px;
      }
    </style>
    <script>
      try {
        var scheme = localStorage.getItem('mantine-color-scheme')
        if (scheme) {
          document.documentElement.setAttribute(
            'data-mantine-color-scheme',
            scheme
          )
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
