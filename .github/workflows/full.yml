name: Full Suite
# The tested commit is in the title so Publish can find this run: see publish.yml.
run-name: Full Suite ${{ github.sha }}

# The verifier, template and example matrices, run once per push to main.
#
# Branch CI keeps only build, lint, unit and the e2e suites: ~90 jobs per push
# across a dozen agent branches queued every run for close to an hour. These
# run after the merge instead, and Release (main.yml) starts when they finish,
# so nothing ships before its commit has been tested. A red run here does not
# stop Release; only a Version Packages publish waits on the result (publish.yml).
# A Version Packages merge only bumps versions, so it is skipped here.
#
# Run it on a branch before merging a risky change:
#   gh workflow run "Full Suite" --ref <branch>
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Latest wins: the newest run on main carries every commit before it. A Version
# Packages run skips everything, so it gets a group of its own: sharing one, it
# cancelled the real run of the merge before it and left main untested.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'Version Packages') && github.run_id || github.ref }}
  cancel-in-progress: true

# better-auth now throws on a missing BETTER_AUTH_SECRET (mapSession errors no
# longer swallowed), so every job that builds/prerenders/runs a template needs
# it present. Inherited by all jobs (build, templates, verifiers, e2e) and by
# spawned bundles via process.env. Build-only dummy, ≥32 chars — never a real secret.
env:
  BETTER_AUTH_SECRET: ci-build-only-better-auth-secret-not-real

jobs:
  build:
    name: Build
    if: ${{ !startsWith(github.event.head_commit.message, 'Version Packages') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          download-build: 'false'
      - uses: ./.github/actions/build

  codegen-perf:
    name: Codegen Perf (500 functions ≤ 30s)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run codegen perf gate
        run: npx tsx benchmarks/bench-codegen-perf.ts

  verifiers:
    name: Verifiers (${{ matrix.verifier }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    strategy:
      fail-fast: false
      matrix:
        verifier:
          [
            addon,
            addon-openapi,
            addon-registry,
            addon-treeshake,
            addon-workspace,
            analytics,
            classification,
            gateway,
            middleware-and-permissions,
            treeshaking,
            types,
            secrets,
            scopes,
            feature-flags,
            workflows,
            variables,
            functions,
            hmr,
            dev-bun,
            deploy-cloudflare,
            deploy-serverless,
            deploy-grouping,
            release,
            deploy-azure,
            deploy-standalone,
            better-auth,
            next-better-auth,
            tanstack-start-better-auth,
            bun-server,
            webhooks,
            db-schema,
            validate,
            mcp-auth,
          ]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cd verifiers/${{ matrix.verifier }} && bun run test

  # The only verifier that runs a browser, so it gets its own job rather than a
  # row in the matrix: every other row would pay for a ~90MB chromium download
  # it never opens. It is what proves the served page actually renders and its
  # own fetches reach the API on the same origin.
  verifiers-fullstack:
    name: Fullstack (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install chromium
        run: cd verifiers/fullstack && npx playwright install --with-deps chromium
      - name: Run fullstack verifier
        run: cd verifiers/fullstack && bun run test

  verifiers-binary:
    name: Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # windows-latest excluded: its pre-installed global Yarn 1.22 shadows
        # Corepack's Yarn 4 in the shared setup action, breaking `bun install`.
        # The pikku-windows-x64.exe is still cross-compiled and published on each
        # release (see packages/cli/build.sh).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Run binary verifier
        shell: bash
        run: cd verifiers/binary && bun run test

  # Vector extensions on both embedded databases, through the CLI and both
  # standalone artifacts. Its own job over two OSes because the macOS path is
  # the one that differs: bun there opens Apple's SQLite, which cannot load
  # extensions, so the CLI and the compiled binary swap in Homebrew's.
  verifiers-db-vectors:
    name: Vector extensions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install a SQLite that loads extensions
        if: runner.os == 'macOS'
        run: brew list sqlite >/dev/null 2>&1 || brew install sqlite
      - name: Run vector extensions verifier
        shell: bash
        run: cd verifiers/db-vectors && bun run test

  # The workflow verifier's pg/redis runners need real queue + storage backends,
  # so they can't run in the plain `verifiers` job. This job gives them Postgres
  # (KyselyWorkflowService + pg-boss) and Redis (RedisWorkflowService + bullmq)
  # and asserts every node's state — provenance + cycles — on both transports.
  verifiers-workflows-db:
    name: Verifiers (workflows, db-backed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    services:
      redis:
        image: mirror.gcr.io/library/redis:7
        ports:
          - 6379:6379
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pikku_queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The lock service's lease is judged by the database's clock, which only a
      # real server has: PGlite and SQLite read the clock of the process asking.
      mysql:
        image: mirror.gcr.io/library/mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: pikku_locks
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cd verifiers/workflows && bun run test:db
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/pikku_queue
      MYSQL_URL: mysql://root:password@localhost:3306/pikku_locks
      REDIS_URL: redis://localhost:6379

  # The db-schema verifier's second pass needs a real postgres server. The
  # sqlite pass runs in the plain `verifiers` job and covers the same thirteen
  # steps, but only postgres has the types the schema sources must agree on —
  # a `uuid` primary key a hand-written `text` foreign key cannot reference, and
  # a migration that compiles either way but is rejected by exactly one of them.
  # It gets a database of its own: the run drops and recreates `public`.
  verifiers-db-schema-db:
    name: Verifiers (db-schema, postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pikku_db_schema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cd verifiers/db-schema && bun run test:db
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/pikku_db_schema

  verifier-coverage:
    name: Verifier Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run functions verifier with coverage
        run: cd verifiers/functions && bun run test:coverage
      - name: Upload verifier coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: verifiers/functions/coverage/lcov.info
          flags: verifiers
          name: verifier-coverage
        continue-on-error: true

  unit-coverage:
    name: Unit Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run package unit tests with coverage
        # --enable-source-maps so tsx-transpiled line numbers map back to the
        # original .ts before lcov is written. A single package's test failure
        # must not halt the sweep, so each run is isolated with `|| warning`.
        # Each package is also capped with `timeout`, because a package whose
        # test process never exits otherwise burns the whole job's 20 minutes
        # and every package sorted after it is never run at all.
        #
        # The cap is a hang detector, not a performance budget, so it sits well
        # above the slowest suite rather than near it. packages/inspector runs
        # 672 tests over real TypeScript programs — 141s plain, 338s under
        # coverage instrumentation — and at 300s it began being killed on every
        # branch at once. CI never runs on main, so a suite creeping past the
        # cap first appears as every open PR going red together.
        env:
          NODE_OPTIONS: --enable-source-maps
        run: |
          : > unit-test-failures.txt
          while IFS= read -r script; do
            dir=$(dirname "$script")
            echo "::group::coverage ${dir}"
            (cd "$dir" && timeout --signal=KILL 600 bash run-tests.sh --coverage) || { status=$?; [ "$status" = 137 ] && echo "::error::unit tests timed out after 600s in ${dir}" || echo "::error::unit tests failed in ${dir}"; echo "$dir" >> unit-test-failures.txt; }
            echo "::endgroup::"
          done < <(find packages -name run-tests.sh -not -path '*/node_modules/*' | sort)
      - name: Merge lcov reports and re-root paths to repo root
        # Each package writes lcov.info with package-relative SF paths (src/...).
        # Prefix them with the package directory so Codecov maps them to the
        # correct file in a monorepo where many packages share src/index.ts.
        run: |
          : > unit-lcov.info
          while IFS= read -r f; do
            dir=$(dirname "$f")
            sed "s#^SF:#SF:${dir}/#" "$f" >> unit-lcov.info
          done < <(find packages -name lcov.info -not -path '*/node_modules/*' | sort)
          echo "Merged $(grep -c '^SF:' unit-lcov.info || echo 0) source files into unit-lcov.info"
      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: unit-lcov.info
          flags: unit
          name: unit-coverage
        continue-on-error: true
      - name: Fail if any package's unit tests failed
        run: |
          if [ -s unit-test-failures.txt ]; then
            echo "Unit tests failed in:"; cat unit-test-failures.txt
            exit 1
          fi

  examples:
    name: Example (${{ matrix.example }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    strategy:
      fail-fast: false
      matrix:
        example: [online-shop, field-service]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Generate, migrate and type-check
        run: cd examples/${{ matrix.example }} && bun run build
      - name: Test
        run: cd examples/${{ matrix.example }} && bun run test

  templates:
    name: Templates (${{ matrix.version }}, ${{ matrix.template }}, ${{ matrix.package-manager }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    services:
      redis:
        image: mirror.gcr.io/library/redis:7
        ports:
          - 6379:6379
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pikku_workspace_starter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        version: [24]
        template: [
            express,
            express-middleware,
            fastify,
            fastify-plugin,
            uws,
            ws,
            aws-lambda,
            aws-lambda-websocket,
            cloudflare-workers,
            cloudflare-websocket,
            nextjs,
            mcp-server,
            pg-boss,
            bullmq,
            workflows-bullmq,
            workflows-pg-boss,
            remote-rpc-pg,
            remote-rpc-redis,
            # ai-postgres is disabled: it drives a live agent turn, and the
            # OPENAI_API_KEY it runs against has no credits left, so both the
            # yarn and bun jobs burn five minutes retrying and fail on `You have
            # no credits remaining.` on every push to every branch. Disabled in
            # `main.yml` too, for the other dead key. Re-enable in both once one
            # of them is funded.
            # ai-postgres,
            bun,
          ]
        package-manager: [yarn, bun]
        exclude:
          - package-manager: bun
            template: uws
          - package-manager: bun
            template: aws-lambda
          - package-manager: bun
            template: aws-lambda-websocket
          - package-manager: bun
            template: cloudflare-workers
          - package-manager: bun
            template: cloudflare-websocket
          - package-manager: bun
            template: nextjs
          - package-manager: bun
            template: nextjs-full
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.version }}
          enable-yarn: ${{ matrix.package-manager == 'yarn' }}
      - name: Test template
        timeout-minutes: 5
        run: ./scripts/test-template.sh "$TEMPLATE_NAME" "$TEMPLATE_VERSION" "$PACKAGE_MANAGER"
        env:
          TEMPLATE_NAME: ${{ matrix.template }}
          TEMPLATE_VERSION: ${{ github.ref_name }}
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
          TEMPLATE_V8_COVERAGE_DIR: ${{ runner.temp }}/template-coverage/${{ matrix.template }}/raw
      - name: Generate template coverage report
        if: always()
        run: |
          if find "${{ runner.temp }}/template-coverage/${{ matrix.template }}/raw" -type f -name '*.json' -print -quit >/dev/null 2>&1; then
            npx --yes c8@11.0.0 report \
              --temp-directory "${{ runner.temp }}/template-coverage/${{ matrix.template }}/raw" \
              --reporter=lcov \
              --report-dir "${{ runner.temp }}/template-coverage/${{ matrix.template }}/report" \
              --exclude '.pikku/**' \
              --exclude 'client/**' \
              --exclude 'src/tests/**'
          fi
      - name: Upload template coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ${{ runner.temp }}/template-coverage/${{ matrix.template }}/report/lcov.info
          flags: templates
          name: template-${{ matrix.template }}
        continue-on-error: true
    env:
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
      DATABASE_URL: postgres://postgres:password@localhost:5432/pikku_workspace_starter
      REDIS_URL: redis://localhost:6379
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SLS_TELEMETRY_DISABLED: 1
      SLS_NOTIFICATIONS_MODE: off
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  templates-no-services:
    name: Templates (${{ matrix.version }}, ${{ matrix.template }}, ${{ matrix.package-manager }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    strategy:
      fail-fast: false
      matrix:
        version: [24]
        template: [cli, tanstack]
        package-manager: [yarn]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.version }}
          enable-yarn: ${{ matrix.package-manager == 'yarn' }}
      - name: Test template
        timeout-minutes: 5
        run: ./scripts/test-template.sh "$TEMPLATE_NAME" "$TEMPLATE_VERSION" "$PACKAGE_MANAGER"
        env:
          TEMPLATE_NAME: ${{ matrix.template-name || matrix.template }}
          TEMPLATE_VERSION: ${{ github.ref_name }}
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
          TEMPLATE_V8_COVERAGE_DIR: ${{ runner.temp }}/template-coverage/${{ matrix.template }}/raw
      - name: Generate template coverage report
        if: always()
        run: |
          if find "${{ runner.temp }}/template-coverage/${{ matrix.template }}/raw" -type f -name '*.json' -print -quit >/dev/null 2>&1; then
            npx --yes c8@11.0.0 report \
              --temp-directory "${{ runner.temp }}/template-coverage/${{ matrix.template }}/raw" \
              --reporter=lcov \
              --report-dir "${{ runner.temp }}/template-coverage/${{ matrix.template }}/report" \
              --exclude '.pikku/**' \
              --exclude 'client/**' \
              --exclude 'src/tests/**'
          fi
      - name: Upload template coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ${{ runner.temp }}/template-coverage/${{ matrix.template }}/report/lcov.info
          flags: templates
          name: template-${{ matrix.template }}
        continue-on-error: true
    env:
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SLS_TELEMETRY_DISABLED: 1
      SLS_NOTIFICATIONS_MODE: off
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  template-runtime-targets:
    name: Template Functions Runtimes (${{ matrix.version }}, ${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    services:
      elasticmq:
        image: softwaremill/elasticmq-native
        ports:
          - 9324:9324
    strategy:
      fail-fast: false
      matrix:
        version: [24]
        target: [dev, standalone]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.version }}
          enable-yarn: ${{ matrix.package-manager == 'yarn' }}
      - name: Test functions template runtime target
        timeout-minutes: 5
        run: cd templates/functions && bun run test:runtime ${{ matrix.target }}
        env:
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_REGION: us-east-1
          SLS_TELEMETRY_DISABLED: 1
          SLS_NOTIFICATIONS_MODE: off
