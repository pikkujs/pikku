name: Build
description: Build all packages, generate pikku files, build templates + console, and upload build artifact

runs:
  using: composite
  steps:
    - name: Restore TypeScript build cache
      uses: actions/cache@v6
      with:
        # tsc -b is incremental: given the prior tsconfig.tsbuildinfo + emitted
        # dist it only recompiles projects whose inputs changed. Key on all
        # package sources + tsconfigs + the lockfile so any change busts it, with
        # a prefix restore-key so unrelated changes still reuse the newest cache.
        #
        # node_modules is excluded because `packages/**/dist` otherwise also
        # matches a dependency's own dist — e.g. packages/console/node_modules/
        # tinyglobby/dist. Restore happens after `yarn install`, so once a run
        # where Yarn nested that dependency is cached, every later run whose
        # hoisting differs gets the directory re-created without its
        # package.json, and Node resolves the shadowed folder instead of the
        # hoisted package. The prefix is versioned so entries poisoned that way
        # are never reached through restore-keys.
        path: |
          packages/**/tsconfig.tsbuildinfo
          packages/**/dist
          !packages/**/node_modules/**
        key: ts-build-v2-${{ hashFiles('packages/**/src/**/*.ts', 'packages/**/tsconfig*.json', 'yarn.lock') }}
        restore-keys: |
          ts-build-v2-
    - name: Build packages
      shell: bash
      run: |
        start=$SECONDS
        yarn build:packages
        echo "::notice::⏱ Build packages: $((SECONDS - start))s"
    - name: Build addons
      shell: bash
      run: |
        start=$SECONDS
        yarn build:addons
        echo "::notice::⏱ Build addons: $((SECONDS - start))s"
    - name: Build function-addon template
      shell: bash
      run: |
        start=$SECONDS
        cd templates/function-addon && yarn pikku && yarn build
        echo "::notice::⏱ Build function-addon template: $((SECONDS - start))s"
    - name: Generate pikku files
      shell: bash
      run: |
        start=$SECONDS
        yarn pikku
        echo "::notice::⏱ Generate pikku files: $((SECONDS - start))s"
    - name: Build templates
      shell: bash
      run: |
        start=$SECONDS
        yarn build:templates
        echo "::notice::⏱ Build templates: $((SECONDS - start))s"
    - name: Generate and type-check console
      shell: bash
      run: |
        start=$SECONDS
        cd packages/console && yarn generate && yarn tsc --noEmit
        echo "::notice::⏱ Console type-check: $((SECONDS - start))s"
    - name: Build console
      shell: bash
      run: |
        start=$SECONDS
        yarn build:console
        echo "::notice::⏱ Build console: $((SECONDS - start))s"

    - name: Save build output (for later jobs)
      uses: actions/upload-artifact@v7
      with:
        name: build-output
        # Same node_modules exclusion as the cache above: these globs otherwise
        # sweep up every dependency's own dist and .pikku alongside our own.
        path: |
          packages/**/dist/**
          packages/**/bin/**
          packages/**/.pikku/**
          packages/cli/console-app/**
          templates/**/.pikku/**
          templates/**/dist/**
          !packages/**/node_modules/**
          !templates/**/node_modules/**
        include-hidden-files: true
        retention-days: 1
