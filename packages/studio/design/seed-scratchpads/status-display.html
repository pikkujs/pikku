<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Status display</title>
    <style>
      :root {
        --bg: #f7f8fa;
        --panel: #ffffff;
        --border: #e6e8ec;
        --text: #1a1d21;
        --dim: #5b616e;
        --faint: #9aa1ad;
        --accent: #6d4aff;
        --ok: #18a957;
        --warn: #e0a200;
        --err: #e5484d;
        --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--text);
        background: var(--bg);
        padding: 28px;
      }
      .head {
        margin-bottom: 22px;
      }
      .head h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }
      .head p {
        margin: 6px 0 0;
        font-size: 13px;
        color: var(--faint);
        max-width: 520px;
        line-height: 1.5;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 18px;
      }
      .opt {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        cursor: pointer;
        transition:
          border-color 140ms,
          box-shadow 140ms,
          transform 140ms;
      }
      .opt:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(20, 22, 30, 0.06);
      }
      .opt.picked {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
      }
      .opt .label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 600;
        color: var(--dim);
        font-family: var(--mono);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      .opt.picked .label {
        color: var(--accent);
      }
      .grip {
        display: inline-grid;
        grid-template-columns: repeat(2, 3px);
        gap: 3px;
      }
      .grip i {
        width: 3px;
        height: 3px;
        border-radius: 9px;
        background: currentColor;
        opacity: 0.6;
      }
      .stage {
        min-height: 92px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* option a — pill */
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 26px;
        padding: 0 12px;
        border-radius: 99px;
        background: color-mix(in srgb, var(--ok) 14%, white);
        color: var(--ok);
        font-size: 12.5px;
        font-weight: 600;
      }
      .pill .dot {
        width: 7px;
        height: 7px;
        border-radius: 99px;
        background: var(--ok);
      }
      /* option b — card row */
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .row .bar {
        width: 4px;
        align-self: stretch;
        border-radius: 4px;
        background: var(--ok);
      }
      .row .t {
        font-size: 13px;
        font-weight: 600;
      }
      .row .s {
        font-size: 11.5px;
        color: var(--faint);
        margin-top: 2px;
      }
      /* option c — ring */
      .ring {
        width: 64px;
        height: 64px;
        border-radius: 99px;
        background: conic-gradient(var(--ok) 78%, var(--border) 0);
        display: grid;
        place-items: center;
      }
      .ring .hole {
        width: 48px;
        height: 48px;
        border-radius: 99px;
        background: var(--panel);
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 700;
      }
      /* option d — banner */
      .banner {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--ok) 10%, white);
        border: 1px solid color-mix(in srgb, var(--ok) 30%, white);
      }
      .banner .ic {
        width: 22px;
        height: 22px;
        border-radius: 99px;
        background: var(--ok);
        color: white;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 700;
      }
      .banner .tx {
        font-size: 12.5px;
        font-weight: 600;
        color: color-mix(in srgb, var(--ok) 60%, var(--text));
      }
    </style>
  </head>
  <body>
    <div class="head">
      <h1>Status display</h1>
      <p>
        Four real, themed ways to show that something is <strong>healthy</strong>. Click one to mark
        it as the option you're going with.
      </p>
    </div>

    <div class="grid">
      <div class="opt picked" data-opt>
        <div class="label">
          <span class="grip"><i></i><i></i><i></i><i></i><i></i><i></i></span> Pill
        </div>
        <div class="stage">
          <span class="pill"><span class="dot"></span> Operational</span>
        </div>
      </div>

      <div class="opt" data-opt>
        <div class="label">
          <span class="grip"><i></i><i></i><i></i><i></i><i></i><i></i></span> Card row
        </div>
        <div class="stage">
          <div class="row">
            <span class="bar"></span>
            <div>
              <div class="t">All systems go</div>
              <div class="s">Updated just now</div>
            </div>
          </div>
        </div>
      </div>

      <div class="opt" data-opt>
        <div class="label">
          <span class="grip"><i></i><i></i><i></i><i></i><i></i><i></i></span> Ring
        </div>
        <div class="stage">
          <div class="ring"><div class="hole">78%</div></div>
        </div>
      </div>

      <div class="opt" data-opt>
        <div class="label">
          <span class="grip"><i></i><i></i><i></i><i></i><i></i><i></i></span> Banner
        </div>
        <div class="stage">
          <div class="banner">
            <span class="ic">&#10003;</span><span class="tx">Service healthy</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      for (const el of document.querySelectorAll('[data-opt]')) {
        el.addEventListener('click', () => {
          for (const o of document.querySelectorAll('[data-opt]')) o.classList.remove('picked')
          el.classList.add('picked')
        })
      }
    </script>
  </body>
</html>
