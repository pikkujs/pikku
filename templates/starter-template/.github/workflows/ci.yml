name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run tsc

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Unit tests
        run: bun test

      - name: Standalone build
        run: bunx --bun pikku deploy apply -p standalone --runtime bun

      - name: Standalone boots
        working-directory: .deploy/standalone/root-dist
        env:
          PORT: '3000'
          PIKKU_DATA_DIR: ${{ runner.temp }}/pikku-data
          BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789
        run: |
          mkdir -p "$PIKKU_DATA_DIR"
          ./root db migrate
          ./root > "$RUNNER_TEMP/standalone.log" 2>&1 &
          if ! curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:3000/api/auth/get-session; then
            cat "$RUNNER_TEMP/standalone.log"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: standalone
          path: .deploy/standalone/root-dist.zip
