name: Publish

# Publishing is split out of `full.yml` because the two want opposite
# concurrency. CI is latest-wins: a new push to main should discard the run
# before it and give feedback on the newest tree. A publish must never be
# discarded — `cancel-in-progress` killed the `Create Release Pull Request or
# Publish` step of five consecutive runs on main, each time with "Canceling
# since a higher priority waiting request exists", so a merged version bump sat
# in package.json with nothing on npm.
#
# Queueing rather than cancelling also closes the partial-publish window: a run
# stopped part-way through `bun run release` can leave some packages published at
# the new version and others not. A queued publish waits for the one ahead of it
# to finish instead of interrupting it.
on:
  workflow_run:
    workflows: ['Full Suite']
    types: [completed]
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Full Suite is the whole of CI on main — validate, lint, build, unit, e2e,
  # verifiers, templates, examples — so a publish needs the run to have
  # succeeded, nothing less. A Version Packages commit skips every Full Suite
  # job (it only bumps versions), so its run reads green whatever the code is;
  # for that commit the result of the commit below it is what counts.
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.conclusion != 'cancelled'
    timeout-minutes: 100
    permissions:
      actions: read
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - name: Require Full Suite to have passed
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          sha=$HEAD_SHA
          conclusion=$CONCLUSION
          if [[ "$HEAD_MESSAGE" == "Version Packages"* ]]; then
            while :; do
              sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" --jq '.parents[0].sha')
              message=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" --jq '.commit.message')
              [[ "$message" == "Version Packages"* ]] || break
            done
            echo "Waiting for Full Suite on ${sha}"
            conclusion=missing
            for _ in $(seq 1 90); do
              conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/full.yml/runs?branch=main&per_page=50" \
                --jq "[.workflow_runs[] | select(.display_title == \"Full Suite ${sha}\")][0] | if . == null then \"missing\" else (.conclusion // \"pending\") end")
              case "$conclusion" in
                missing|pending) sleep 60 ;;
                *) break ;;
              esac
            done
          fi

          if [ "$conclusion" = success ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Full Suite on \`${sha:0:9}\`: success. Publishing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Full Suite on ${sha} is '$conclusion'"
            echo "Full Suite on \`${sha:0:9}\`: **$conclusion**. **Not publishing.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    # Publishing is npm trusted publishing (OIDC), so the job needs to mint an
    # id-token. Naming any permission drops the repo-wide `write` default for
    # every one not listed, so the two this job already relied on are spelled
    # out: `contents` pushes the git tags and creates the GitHub releases the
    # binary upload then attaches to, and `pull-requests` opens Version Packages.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      # `workflow_run` starts from the default branch, so the commit that was
      # actually tested has to be named explicitly. Full history is what
      # changesets reads tags from.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      # `download-build: false` because there is no `build-output` artifact to
      # download: it is uploaded by the `Build` job of the *Full Suite* run, and a
      # `workflow_run` job can only reach its own run's artifacts. `bun run release`
      # below rebuilds every package from source anyway (`build:packages` →
      # `pikku` → `build:addons` → `build:console`), which is also where
      # `packages/cli/release/binaries/` comes from — so nothing is lost. The
      # default left every publish dead on `Artifact not found for name:
      # build-output` before `changesets/action` ever ran.
      - uses: ./.github/actions/setup
        with:
          download-build: 'false'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: node .github/changeset-version.cjs
          publish: bun run release
          createGithubReleases: true
        # No NPM_TOKEN, deliberately. npm now demands a 2FA OTP that a classic
        # token cannot answer, which is what had every release since 2026-09-02
        # failing on `child "otp" fails`. Trusted publishing is exempt — but in
        # bun run the OIDC branch sits *after* the token check, so a token left in
        # this env would short-circuit OIDC and put the failure straight back.
        # changesets/action is likewise guarded on NPM_TOKEN being absent.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
      - name: Upload CLI native binaries to GitHub Release
        if: steps.changesets.outputs.published == 'true'
        id: upload-binaries
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published='${{ steps.changesets.outputs.publishedPackages }}'
          cli_version=$(echo "$published" | node -e "
            const pkgs = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const cli = pkgs.find(p => p.name === '@pikku/cli');
            if (cli) process.stdout.write(cli.version);
          ")
          if [ -z "$cli_version" ]; then
            echo "@pikku/cli was not published this run — skipping binary upload"
            exit 0
          fi
          echo "cli_version=${cli_version}" >> "$GITHUB_OUTPUT"
          tag="@pikku/cli@${cli_version}"
          echo "Uploading binaries for $tag"
          for f in packages/cli/release/binaries/*; do
            [ -f "$f" ] || continue
            echo "  Uploading $(basename $f)"
            gh release upload "$tag" "$f" --clobber
          done
      - name: Update Homebrew tap
        if: steps.upload-binaries.outputs.cli_version != ''
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          CLI_VERSION="${{ steps.upload-binaries.outputs.cli_version }}"
          ARM_SHA=$(sha256sum packages/cli/release/binaries/pikku-darwin-arm64 | cut -d' ' -f1)
          X64_SHA=$(sha256sum packages/cli/release/binaries/pikku-darwin-x64 | cut -d' ' -f1)
          ENCODED_TAG="%40pikku%2Fcli%40${CLI_VERSION}"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/pikkujs/homebrew-pikku.git" tap
          cd tap

          mkdir -p Casks
          cat > Casks/pikku.rb << CASK
          cask "pikku" do
            version "${CLI_VERSION}"

            on_arm do
              url "https://github.com/pikkujs/pikku/releases/download/${ENCODED_TAG}/pikku-darwin-arm64"
              sha256 "${ARM_SHA}"
              binary "pikku-darwin-arm64", target: "pikku"
            end
            on_intel do
              url "https://github.com/pikkujs/pikku/releases/download/${ENCODED_TAG}/pikku-darwin-x64"
              sha256 "${X64_SHA}"
              binary "pikku-darwin-x64", target: "pikku"
            end

            name "Pikku"
            desc "Code generation tool for type-safe backend development"
            homepage "https://pikku.dev"
          end
          CASK

          git config user.email "ci@pikku.dev"
          git config user.name "Pikku CI"
          git add Casks/pikku.rb
          git commit -m "pikku ${CLI_VERSION}"
          git push

  sync-templates-stackblitz:
    name: Sync Templates
    runs-on: ubuntu-24.04
    needs: publish
    if: needs.publish.outputs.published == 'true'
    environment: sync-templates-approval
    strategy:
      fail-fast: false
      matrix:
        version: [24]
        template:
          [
            express,
            express-middleware,
            fastify,
            fastify-plugin,
            uws,
            ws,
            aws-lambda,
            aws-lambda-websocket,
            cloudflare-workers,
            cloudflare-websocket,
            nextjs,
            mcp-server,
            cli,
            pg-boss,
            bullmq,
            workflows-bullmq,
            workflows-pg-boss,
            remote-rpc-pg,
            remote-rpc-redis,
          ]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Create Template
        run: npm create pikku@latest -- --template ${{ matrix.template }} --version ${{ github.ref_name }} --name ../test-app --install --package-manager npm --stackblitz

      - name: Sync template repository
        run: ./scripts/sync-template-repos.sh ${{ matrix.template }} --apply --token ${{ secrets.SYNC_TOKEN_GITHUB }}
