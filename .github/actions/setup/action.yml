name: Setup
description: Setup Node, download build output, and install dependencies. Must run after actions/checkout.

inputs:
  node-version:
    description: Node.js version
    default: '24'
  download-build:
    description: Whether to download build output artifact
    default: 'true'
  enable-yarn:
    description: >-
      Enable Corepack's Yarn 4. The monorepo itself installs with bun, but the
      template jobs scaffold user-facing apps with whichever package manager
      their matrix row names, and the yarn rows need a yarn on PATH.
    default: 'false'

runs:
  using: composite
  steps:
    - if: ${{ inputs.enable-yarn == 'true' }}
      run: corepack enable
      shell: bash
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.0
    - name: Download build output
      if: ${{ inputs.download-build == 'true' }}
      uses: actions/download-artifact@v8
      with:
        name: build-output
    # A dependency whose postinstall downloads a release binary (serverless,
    # workerd, esbuild) fails the whole install when that fetch blips, and the
    # job then reads as a broken pull request. Bun resumes from what it
    # already resolved, so a repeat attempt is cheap.
    # `--frozen-lockfile` cannot be used here: `uWebSockets.js` is a `github:`
    # dependency of both the root and @pikku/uws, and bun re-resolves it on
    # every frozen install and then declares the lockfile changed — every
    # attempt, so the retry above never gets past it. A plain install leaves
    # bun.lock byte-identical, so comparing it afterwards asks the same question
    # the frozen flag was there to ask: is the committed lockfile complete and
    # up to date with the manifests?
    #
    # Compared by checksum rather than `git diff`: the e2e jobs run inside a
    # container where the checkout is not a git directory the container user may
    # read, and there a git failure would read as a changed lockfile.
    - name: Install dependencies
      shell: bash
      # The cache lives beside the workspace rather than under $HOME so that it
      # shares a filesystem with node_modules. In the container jobs it does
      # not otherwise: the checkout and the runner temp directory are volumes
      # mounted from the host while $HOME is the container's own writable
      # layer, and bun links packages out of the cache and into the store
      # across that boundary. It sits in the temp directory rather than in the
      # checkout so that prettier, oxlint and knip do not walk it.
      env:
        BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      run: |
        before=$(sha256sum bun.lock | cut -d' ' -f1)
        for attempt in 1 2 3; do
          if bun install; then
            after=$(sha256sum bun.lock | cut -d' ' -f1)
            if [ "$before" != "$after" ]; then
              echo "::error::bun install updated bun.lock — commit the updated lockfile"
              exit 1
            fi
            # A dangling link means bun linked a package whose store entry
            # never landed. `bun install` reports success either way, and the
            # job then fails much later as a missing module — which is how a
            # flake extracting uWebSockets.js surfaced four jobs downstream as
            # `Cannot find package 'better-sqlite3'`.
            dangling=$(find . -maxdepth 6 -path '*/node_modules/*' -type l ! -exec test -e {} \; -print 2>/dev/null | head -20)
            if [ -n "$dangling" ]; then
              echo "::warning::node_modules holds links to packages that were never installed:"
              echo "$dangling"
            fi
            exit 0
          fi
          if [ "$attempt" = 3 ]; then
            echo "::error::bun install failed after $attempt attempts"
            exit 1
          fi
          echo "::warning::bun install failed (attempt $attempt), retrying"
          # The failure this retry exists for is `ENOENT: copy file <name>`,
          # naming a different file of uWebSockets.js on every attempt. Bun
          # links a package out of its cache entry into the store, and that is
          # the copy fallback for when the hardlink cannot be made — so a file
          # vanishing mid-copy means something is rewriting the cache entry
          # while it is being read (oven-sh/bun#36227, whose fix is unmerged).
          # Only the container jobs hit it, so the facts that decide it are
          # properties of their filesystems, which exist nowhere else; print
          # them rather than guess again.
          if [ "$attempt" = 1 ]; then
            echo "cache dir:    $BUN_INSTALL_CACHE_DIR"
            stat -f -c 'cache fs:     %T' "$BUN_INSTALL_CACHE_DIR" 2>&1 || true
            stat -f -c 'workspace fs: %T' . 2>&1 || true
            stat -c 'cache dev:     %d' "$BUN_INSTALL_CACHE_DIR" 2>&1 || true
            stat -c 'workspace dev: %d' . 2>&1 || true
            uws=$(find "$BUN_INSTALL_CACHE_DIR" -maxdepth 1 -name '*uWebSockets*' 2>/dev/null | head -1)
            if [ -n "$uws" ]; then
              echo "cache entry $uws holds $(find "$uws" -type f | wc -l) files"
            else
              echo "no uWebSockets.js entry in the cache"
            fi
          fi
          # The tree goes but the cache stays. A failed install leaves a
          # half-linked node_modules that the next one reads as work it has
          # already done, reporting success over a tree still missing whatever
          # the failure interrupted. The cache entry, by contrast, is what the
          # next attempt needs: finding a package already extracted there is
          # what lets it skip the extract-and-publish that races.
          find . -maxdepth 5 -name node_modules -type d -prune -exec rm -rf {} +
          sleep $((attempt * 15))
        done
