name: Publish

# Publishing is split out of `full.yml` because the two want opposite
# concurrency. CI is latest-wins: a new push to main should discard the run
# before it and give feedback on the newest tree. A publish must never be
# discarded — `cancel-in-progress` killed the `Create Release Pull Request or
# Publish` step of five consecutive runs on main, each time with "Canceling
# since a higher priority waiting request exists", so a merged version bump sat
# in package.json with nothing on npm.
#
# Queueing rather than cancelling also closes the partial-publish window: a run
# stopped part-way through `bun run release` can leave some packages published at
# the new version and others not. A queued publish waits for the one ahead of it
# to finish instead of interrupting it.
on:
  workflow_run:
    workflows: ['Full Suite']
    types: [completed]
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Full Suite is the whole of CI on main — validate, lint, build, unit, e2e,
  # verifiers, templates, examples — so a publish needs the run to have
  # succeeded, nothing less. A Version Packages commit skips every Full Suite
  # job (it only bumps versions), so its run reads green whatever the code is;
  # for that commit the result of the commit below it is what counts.
  #
  # `branches: [main]` is matched against the run's head branch, which for a
  # fork pull request is whatever the fork named its branch, and the pull
  # request can give its own copy of full.yml a `pull_request` trigger. So the
  # run must also come from this repository and from a push or a dispatch, the
  # two events only someone with write access can raise.
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    timeout-minutes: 100
    permissions:
      actions: read
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - name: Require Full Suite to have passed
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          sha=$HEAD_SHA
          conclusion=$CONCLUSION
          if [[ "$HEAD_MESSAGE" == "Version Packages"* ]]; then
            while :; do
              sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" --jq '.parents[0].sha')
              message=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" --jq '.commit.message')
              [[ "$message" == "Version Packages"* ]] || break
            done
            echo "Waiting for Full Suite on ${sha}"
            conclusion=missing
            for _ in $(seq 1 90); do
              conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/full.yml/runs?branch=main&per_page=50" \
                --jq "[.workflow_runs[] | select(.display_title == \"Full Suite ${sha}\")
                  | select(.head_repository.full_name == \"${GITHUB_REPOSITORY}\" and (.event == \"push\" or .event == \"workflow_dispatch\"))][0]
                  | if . == null then \"missing\" else (.conclusion // \"pending\") end")
              case "$conclusion" in
                missing|pending) sleep 60 ;;
                *) break ;;
              esac
            done
          fi

          if [ "$conclusion" = success ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Full Suite on \`${sha:0:9}\`: success. Publishing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Full Suite on ${sha} is '$conclusion'"
            echo "Full Suite on \`${sha:0:9}\`: **$conclusion**. **Not publishing.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # pikku-inspect-rs for every platform it ships on, built natively on a runner
  # of each: @pikku/inspector-go publishes it beside pikku-inspect under
  # prebuilt/. The Publish job below needs all three.
  inspector-rs:
    name: Rust build (pikku-inspect-rs, ${{ matrix.target }})
    needs: gate
    if: >-
      needs.gate.outputs.ok == 'true' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: darwin-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.target }}
      - name: Build pikku-inspect-rs
        run: cargo build --release --locked --manifest-path packages/inspector-rust/Cargo.toml
      - name: Place the binary under its prebuilt/ target
        run: |
          mkdir -p packages/inspector-go/prebuilt/${{ matrix.target }}
          cp packages/inspector-rust/target/release/pikku-inspect-rs packages/inspector-go/prebuilt/${{ matrix.target }}/
      - name: Pack
        run: tar cf pikku-inspect-rs-${{ matrix.target }}.tar packages/inspector-go/prebuilt/${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: pikku-inspect-rs-${{ matrix.target }}
          path: pikku-inspect-rs-${{ matrix.target }}.tar
          retention-days: 1

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    needs: [gate, inspector-rs]
    if: >-
      needs.gate.outputs.ok == 'true' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    # Publishing is npm trusted publishing (OIDC), so the job needs to mint an
    # id-token. Naming any permission drops the repo-wide `write` default for
    # every one not listed, so the two this job already relied on are spelled
    # out: `contents` pushes the git tags and creates the GitHub releases the
    # binary upload then attaches to, and `pull-requests` opens Version Packages.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.published-packages }}
    steps:
      # `workflow_run` starts from the default branch, so the commit that was
      # actually tested has to be named explicitly. Full history is what
      # changesets reads tags from.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      # Before anything in the checked-out tree runs, the commit has to be on main.
      - name: Require the tested commit to be on main
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! git merge-base --is-ancestor "$HEAD_SHA" refs/remotes/origin/main; then
            echo "::error::${HEAD_SHA} is not on main. Not publishing."
            exit 1
          fi
      # `download-build: false` because there is no `build-output` artifact to
      # download: it is uploaded by the `Build` job of the *Full Suite* run, and a
      # `workflow_run` job can only reach its own run's artifacts. `bun run release`
      # below rebuilds every package from source anyway (`build:packages` →
      # `pikku` → `build:addons`), which is also where
      # `packages/cli/release/binaries/` comes from — so nothing is lost. The
      # default left every publish dead on `Artifact not found for name:
      # build-output` before `changesets/action` ever ran.
      - uses: ./.github/actions/setup
        with:
          download-build: 'false'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # @pikku/inspector-go ships a pikku-inspect binary for every target under
      # prebuilt/, which is gitignored, so they are built here before
      # `bun run release` publishes it. They are checked up front too: its
      # prepublishOnly checks them, but only as npm reaches it, by which time
      # packages before it in the run are already on npm.
      - uses: actions/setup-go@v6
        with:
          go-version-file: packages/inspector-go/go.mod
          cache-dependency-path: packages/inspector-go/**/go.sum
      - name: Cross-compile pikku-inspect for every target
        run: node packages/inspector-go/scripts/build-go.mjs --all
      - name: Download pikku-inspect-rs for every platform
        uses: actions/download-artifact@v8
        with:
          pattern: pikku-inspect-rs-*
          merge-multiple: true
      - name: Unpack pikku-inspect-rs
        run: for t in pikku-inspect-rs-*.tar; do tar xf "$t" && rm "$t"; done
      - name: Check every target has its binary
        run: node packages/inspector-go/scripts/check-platform-binary.mjs
      - name: Create Release Pull Request or Publish
        id: changesets
        # v2 because @changesets/cli 3 stopped printing the `New tag:` lines v1
        # scraped. v1 then reported `published: false` after a successful
        # publish, so no tag, GitHub Release, binary upload, Homebrew update or
        # template sync ran from #1302 on. v2 reads the file named by
        # CHANGESETS_OUTPUT instead, which reaches `changeset publish` through
        # `bun run release`.
        uses: changesets/action@v2.1.2
        with:
          version-script: node .github/changeset-version.cjs
          publish-script: bun run release
          create-github-releases: true
          # Pushes the same way v1 did. v2's default is the GitHub API.
          push-with-git-cli: true
        # No NPM_TOKEN, deliberately. npm now demands a 2FA OTP that a classic
        # token cannot answer, which is what had every release since 2026-09-02
        # failing on `child "otp" fails`. Trusted publishing is exempt — but in
        # bun run the OIDC branch sits *after* the token check, so a token left in
        # this env would short-circuit OIDC and put the failure straight back.
        # changesets/action takes its GitHub token from the `github-token` input,
        # which defaults to this job's token, and does not touch npm auth.
        env:
          HUSKY: '0'
      - name: Upload CLI native binaries to GitHub Release
        if: steps.changesets.outputs.published == 'true'
        id: upload-binaries
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published='${{ steps.changesets.outputs.published-packages }}'
          cli_version=$(echo "$published" | node -e "
            const pkgs = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const cli = pkgs.find(p => p.name === '@pikku/cli');
            if (cli) process.stdout.write(cli.version);
          ")
          if [ -z "$cli_version" ]; then
            echo "@pikku/cli was not published this run — skipping binary upload"
            exit 0
          fi
          echo "cli_version=${cli_version}" >> "$GITHUB_OUTPUT"
          tag="@pikku/cli@${cli_version}"
          # A missing binary is a release a user cannot install, so it fails here
          # instead of uploading whatever happens to be in the directory.
          for name in pikku-linux-x64 pikku-linux-arm64 pikku-darwin-arm64 pikku-windows-x64.exe; do
            if [ ! -f "packages/cli/release/binaries/$name" ]; then
              echo "::error::$name was not built; bun run release sets PIKKU_CLI_BINARIES=all"
              exit 1
            fi
          done
          echo "Uploading binaries for $tag"
          for f in packages/cli/release/binaries/*; do
            [ -f "$f" ] || continue
            echo "  Uploading $(basename $f)"
            gh release upload "$tag" "$f" --clobber
          done
      - name: Upload pikku-inspect binaries to GitHub Release
        if: steps.changesets.outputs.published == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published='${{ steps.changesets.outputs.published-packages }}'
          version=$(echo "$published" | node -e "
            const pkgs = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const go = pkgs.find(p => p.name === '@pikku/inspector-go');
            if (go) process.stdout.write(go.version);
          ")
          if [ -z "$version" ]; then
            echo "@pikku/inspector-go was not published this run — skipping binary upload"
            exit 0
          fi
          tag="@pikku/inspector-go@${version}"
          assets=$(mktemp -d)
          for dir in packages/inspector-go/prebuilt/*/; do
            target=$(basename "$dir")
            ext=""
            [[ "$target" == win32-* ]] && ext=".exe"
            cp "${dir}pikku-inspect${ext}" "$assets/pikku-inspect-${target}${ext}"
            [ -f "${dir}pikku-inspect-rs" ] && cp "${dir}pikku-inspect-rs" "$assets/pikku-inspect-rs-${target}"
          done
          (cd "$assets" && sha256sum pikku-inspect-* > SHA256SUMS)
          echo "Uploading pikku-inspect binaries for $tag"
          gh release upload "$tag" "$assets"/* --clobber
      - name: Update Homebrew tap
        if: steps.upload-binaries.outputs.cli_version != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          CLI_VERSION="${{ steps.upload-binaries.outputs.cli_version }}"
          ENCODED_TAG="%40pikku%2Fcli%40${CLI_VERSION}"

          # A cask downloads one file per arch, so pikku and the pikku-inspect
          # built in this run go out together. The compiled CLI has no
          # prebuilt/ of its own and finds pikku-inspect beside itself.
          archives=$(mktemp -d)
          for arch in arm64; do
            dir=$(mktemp -d)
            cp "packages/cli/release/binaries/pikku-darwin-${arch}" "$dir/pikku"
            cp "packages/inspector-go/prebuilt/darwin-${arch}/pikku-inspect" "$dir/pikku-inspect"
            chmod 755 "$dir/pikku" "$dir/pikku-inspect"
            tar -czf "$archives/pikku-darwin-${arch}.tar.gz" -C "$dir" pikku pikku-inspect
          done
          gh release upload "@pikku/cli@${CLI_VERSION}" "$archives"/*.tar.gz --clobber
          ARM_SHA=$(sha256sum "$archives/pikku-darwin-arm64.tar.gz" | cut -d' ' -f1)

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/pikkujs/homebrew-pikku.git" tap
          cd tap

          mkdir -p Casks
          cat > Casks/pikku.rb << CASK
          cask "pikku" do
            version "${CLI_VERSION}"

            on_arm do
              url "https://github.com/pikkujs/pikku/releases/download/${ENCODED_TAG}/pikku-darwin-arm64.tar.gz"
              sha256 "${ARM_SHA}"
            end

            binary "pikku"
            binary "pikku-inspect"

            name "Pikku"
            desc "Code generation tool for type-safe backend development"
            homepage "https://pikku.dev"
          end
          CASK

          git config user.email "ci@pikku.dev"
          git config user.name "Pikku CI"
          git add Casks/pikku.rb
          git commit -m "pikku ${CLI_VERSION}"
          git push

  sync-templates-stackblitz:
    name: Sync Templates
    runs-on: ubuntu-24.04
    needs: publish
    if: needs.publish.outputs.published == 'true'
    environment: sync-templates-approval
    strategy:
      fail-fast: false
      matrix:
        version: [24]
        template:
          [
            express,
            express-middleware,
            fastify,
            fastify-plugin,
            uws,
            ws,
            aws-lambda,
            aws-lambda-websocket,
            cloudflare-workers,
            cloudflare-websocket,
            nextjs,
            mcp-server,
            cli,
            pg-boss,
            bullmq,
            workflows-bullmq,
            workflows-pg-boss,
            mesh-rpc-pg,
            mesh-rpc-redis,
          ]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Create Template
        run: npm create pikku@latest -- --template ${{ matrix.template }} --version ${{ github.ref_name }} --name ../test-app --install --package-manager npm --stackblitz

      - name: Sync template repository
        run: ./scripts/sync-template-repos.sh ${{ matrix.template }} --apply --token ${{ secrets.SYNC_TOKEN_GITHUB }}
