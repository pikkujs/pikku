name: Release

on:
  push:
    branches:
      - main

# Latest wins. A push to main supersedes whatever is already running for main,
# rather than queueing behind it — without this, a burst of merges left each run
# discarded in turn while still waiting for a runner, and a fix could sit merged
# but unreleased for hours.
#
# The newest run carries every commit that came before it, so nothing is lost by
# cancelling an older one. Publishing is the exception, and it no longer lives
# here: `publish.yml` picks up a successful run of this workflow and queues
# instead of cancelling. See that file for why.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# better-auth now throws on a missing BETTER_AUTH_SECRET (mapSession errors no
# longer swallowed), so every job that builds/prerenders/runs a template needs
# it present. Inherited by all jobs (build, templates, verifiers, e2e) and by
# spawned bundles via process.env. Build-only dummy, ≥32 chars — never a real secret.
env:
  BETTER_AUTH_SECRET: ci-build-only-better-auth-secret-not-real

jobs:
  validate-deps:
    name: Validate Package Deps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check published deps for workspace protocol
        run: node scripts/check-no-workspace-protocol.mjs
      - name: Check no publish-time CLI rebuild
        run: node scripts/check-no-publish-time-cli-rebuild.mjs
      - name: Test the semver range helpers
        run: node --test scripts/semver-ranges.test.mjs
      - name: Check peer dependency ranges agree across the monorepo
        run: node scripts/check-peer-dependency-consistency.mjs

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          download-build: 'false'
      - name: Check formatting
        run: yarn prettier
      - name: Lint
        run: yarn lint
      - name: Check no runtime i18n key resolvers
        run: node scripts/check-no-i18n-key-resolver.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          download-build: 'false'
      - uses: ./.github/actions/build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: yarn test

  e2e:
    name: E2E Standard
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pikkujs/pikku-e2e:v1.58.2-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/e2e-codegen
      - name: Run e2e tests
        run: yarn test:e2e

  e2e-agent:
    name: E2E Agent (deterministic)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pikkujs/pikku-e2e:v1.58.2-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/e2e-codegen
      - name: Run deterministic agent e2e tests
        run: yarn test:e2e:agent

  e2e-cli:
    name: E2E CLI
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pikkujs/pikku-e2e:v1.58.2-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/e2e-codegen
      - name: Run CLI e2e tests
        run: yarn test:e2e:cli

  e2e-ai-live:
    name: E2E AI (live)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pikkujs/pikku-e2e:v1.58.2-noble
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Nine live-model scenarios plus a browser run, and setup eats ~3 of the
    # budget. At 15 the step was cancelled mid-run every time, which marks the
    # whole Release run "cancelled" even though `release` does not need this
    # job — so a green release was unreadable. The inner cap is what still
    # catches a genuine hang.
    timeout-minutes: 30
    needs: [e2e, e2e-agent, verifiers, templates]
    if: ${{ github.repository_owner == 'pikkujs' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/e2e-codegen
      - name: Run live-model AI e2e tests
        timeout-minutes: 22
        run: yarn test:e2e:ai-live
        env:
          # OpenRouter, reached through the standard OPENAI_* pair because
          # `createDevAgentRunner` builds one openai-compatible provider from
          # whatever that pair points at. `parseModel` strips the provider
          # prefix, so the agents' `openai/gpt-5.6-luna` arrives as
          # `gpt-5.6-luna` — which OpenRouter resolves to the same model an
          # unprefixed name would. No agent declaration changes.
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # A persona's own turns are LLM calls made in the scenario process,
          # not on the target, and that runner is built by `createDevAgentRunner`
          # — which needs a base URL paired with the key and disables agents
          # without one. Every conversing scenario then fails with
          # AIProviderNotConfiguredError before it says anything.
          OPENAI_BASE_URL: https://openrouter.ai/api/v1

  verifiers:
    name: Verifiers (${{ matrix.verifier }}, ${{ matrix.package-manager }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    strategy:
      fail-fast: false
      matrix:
        verifier: [
            addon,
            addon-treeshake,
            # binary,
            classification,
            gateway,
            middleware-and-permissions,
            treeshaking,
            types,
            secrets,
            scopes,
            workflows,
            variables,
            functions,
            hmr,
            dev-bun,
            deploy-cloudflare,
            deploy-serverless,
            deploy-azure,
            deploy-standalone,
            better-auth,
            bun-server,
            webhooks,
            db-schema,
          ]
        package-manager: [yarn, bun]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cd verifiers/${{ matrix.verifier }} && ${{ matrix.package-manager == 'bun' && 'bun run' || 'yarn' }} test

  # The only verifier that runs a browser, so it gets its own job rather than a
  # row in the matrix: every other row would pay for a ~90MB chromium download
  # it never opens. It is what proves the served page actually renders and its
  # own fetches reach the API on the same origin.
  verifiers-fullstack:
    name: Fullstack (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install chromium
        run: cd verifiers/fullstack && npx playwright install --with-deps chromium
      - name: Run fullstack verifier
        run: cd verifiers/fullstack && yarn test

  verifiers-binary:
    name: Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # windows-latest excluded: its pre-installed global Yarn 1.22 shadows
        # Corepack's Yarn 4 in the shared setup action, breaking `yarn install`.
        # The pikku-windows-x64.exe is still cross-compiled and published on each
        # release (see packages/cli/build.sh).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Run binary verifier
        shell: bash
        run: cd verifiers/binary && yarn test

  # The workflow verifier's pg/redis runners need real queue + storage backends,
  # so they can't run in the plain `verifiers` job. This job gives them Postgres
  # (KyselyWorkflowService + pg-boss) and Redis (RedisWorkflowService + bullmq)
  # and asserts every node's state — provenance + cycles — on both transports.
  verifiers-workflows-db:
    name: Verifiers (workflows, db-backed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    services:
      redis:
        image: mirror.gcr.io/library/redis:7
        ports:
          - 6379:6379
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pikku_queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cd verifiers/workflows && yarn test:db
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/pikku_queue
      REDIS_URL: redis://localhost:6379

  # The db-schema verifier's second pass needs a real postgres server. The
  # sqlite pass runs in the plain `verifiers` job and covers the same thirteen
  # steps, but only postgres has the types the schema sources must agree on —
  # a `uuid` primary key a hand-written `text` foreign key cannot reference, and
  # a migration that compiles either way but is rejected by exactly one of them.
  # It gets a database of its own: the run drops and recreates `public`.
  verifiers-db-schema-db:
    name: Verifiers (db-schema, postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pikku_db_schema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cd verifiers/db-schema && yarn test:db
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/pikku_db_schema

  examples:
    name: Example (${{ matrix.example }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    strategy:
      fail-fast: false
      matrix:
        example: [online-shop]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Generate, migrate and type-check
        run: cd examples/${{ matrix.example }} && yarn build
      - name: Test
        run: cd examples/${{ matrix.example }} && yarn test

  templates:
    name: Templates (${{ matrix.version }}, ${{ matrix.template }}, ${{ matrix.package-manager }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    services:
      redis:
        image: mirror.gcr.io/library/redis:7
        ports:
          - 6379:6379
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pikku_workspace_starter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        version: [24]
        template:
          [
            express,
            express-middleware,
            fastify,
            fastify-plugin,
            uws,
            ws,
            aws-lambda,
            aws-lambda-websocket,
            cloudflare-workers,
            cloudflare-websocket,
            nextjs,
            mcp-server,
            pg-boss,
            bullmq,
            workflows-bullmq,
            workflows-pg-boss,
            remote-rpc-pg,
            remote-rpc-redis,
            ai-postgres,
          ]
        package-manager: [yarn]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.version }}
      - name: Test template
        timeout-minutes: 5
        run: ./scripts/test-template.sh "$TEMPLATE_NAME" "$TEMPLATE_VERSION"
        env:
          TEMPLATE_NAME: ${{ matrix.template }}
          TEMPLATE_VERSION: ${{ github.ref_name }}
    env:
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
      DATABASE_URL: postgres://postgres:password@localhost:5432/pikku_workspace_starter
      REDIS_URL: redis://localhost:6379
      # ai-postgres runs a live agent turn, so it needs the same gateway the AI
      # e2e job uses — see the OPENAI_BASE_URL comment there.
      OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      SLS_TELEMETRY_DISABLED: 1
      SLS_NOTIFICATIONS_MODE: off

  templates-no-services:
    name: Templates (${{ matrix.version }}, ${{ matrix.template }}, ${{ matrix.package-manager }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    strategy:
      fail-fast: false
      matrix:
        version: [24]
        template: [cli, tanstack]
        package-manager: [yarn]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.version }}
      - name: Test template
        timeout-minutes: 5
        run: ./scripts/test-template.sh "$TEMPLATE_NAME" "$TEMPLATE_VERSION"
        env:
          TEMPLATE_NAME: ${{ matrix.template-name || matrix.template }}
          TEMPLATE_VERSION: ${{ github.ref_name }}
    env:
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SLS_TELEMETRY_DISABLED: 1
      SLS_NOTIFICATIONS_MODE: off

  template-runtime-targets:
    name: Template Functions Runtimes (${{ matrix.version }}, ${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    services:
      elasticmq:
        image: softwaremill/elasticmq-native
        ports:
          - 9324:9324
    strategy:
      fail-fast: false
      matrix:
        version: [24]
        target: [dev, standalone]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.version }}
      - name: Test functions template runtime target
        timeout-minutes: 5
        run: cd templates/functions && yarn test:runtime ${{ matrix.target }}
        env:
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_REGION: us-east-1
          SLS_TELEMETRY_DISABLED: 1
          SLS_NOTIFICATIONS_MODE: off
